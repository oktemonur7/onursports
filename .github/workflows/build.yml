name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Gradle wrapper çalıştırılabilir yap
        run: chmod +x gradlew

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Debug APK derle
        run: ./gradlew assembleDebug --stacktrace

      - name: APK dosyasını bul (debug)
        run: find . -name "*.apk" -type f 2>/dev/null || echo "APK bulunamadi"

      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: TvLiveMatch-debug
          path: "**/*.apk"
          retention-days: 30
