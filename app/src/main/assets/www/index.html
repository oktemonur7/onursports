<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Onur Sports</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="app">

  <!-- Header: Logo + Ticker -->
  <div class="app-header">
    <img src="logo.jpg" class="app-logo" alt="Onur Sports" />
    <div class="ticker-wrap">
      <div class="ticker-inner">
        <span class="ticker-text">
          Ünlü futbolcu Hakan Ünal, jet sosyete Ajda hanım, iş insanı Ali bey hepsi Onur Sports'da
          &nbsp;&nbsp;&nbsp;⚽&nbsp;&nbsp;&nbsp;
          Ünlü futbolcu Hakan Ünal, jet sosyete Ajda hanım, iş insanı Ali bey hepsi Onur Sports'da
          &nbsp;&nbsp;&nbsp;⚽&nbsp;&nbsp;&nbsp;
        </span>
      </div>
    </div>
  </div>

  <!-- Loading -->
  <div id="loading-screen">
    <div class="spinner"></div>
    <p>Maçlar yükleniyor…</p>
  </div>

  <!-- Error -->
  <div id="error-screen" style="display:none">
    <div class="error-icon">⚠️</div>
    <p id="error-msg">Bağlantı hatası oluştu.</p>
    <button id="error-retry-btn" tabindex="0">Yeniden Dene</button>
  </div>

  <!-- Match Grid -->
  <div id="match-grid-wrap">
    <div id="match-grid" style="display:none"></div>
  </div>

</div>

<!-- Source Popup -->
<div id="source-popup-overlay" role="dialog" aria-modal="true">
  <div id="source-popup">
    <div class="popup-header">
      <div id="popup-match-title"></div>
      <div id="popup-match-info"></div>
    </div>
    <div class="popup-divider"></div>
    <div class="popup-source-label">Kaynak Seçin</div>
    <div id="popup-source-list" role="list"></div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/player.js"></script>
<script src="js/ui.js"></script>
<script>
  window.AppMain = (() => {
    // İlk yükleme: loading ekranı göster
    async function load() {
      UI.showLoading();
      try {
        const matches = await AppAPI.fetchAllMatches();
        UI.hideLoading();
        UI.renderMatchList(matches);
      } catch (err) {
        UI.showError('Maçlar yüklenemedi.');
      }
    }

    // Sessiz yenileme: mevcut listeyi gizleme, arka planda güncelle
    async function silentLoad() {
      try {
        const matches = await AppAPI.fetchAllMatches();
        UI.renderMatchList(matches); // loading ekranı göstermeden direkt güncelle
      } catch (err) {
        console.warn('[AppMain] Sessiz yenileme başarısız, liste korundu.');
        // Hata olursa mevcut maçları koru, ekran boşaltma
      }
    }

    function init() {
      UI.init();
      load();
      // 5 dakikada bir sessiz yenile
      UI.scheduleRefresh(silentLoad, 5 * 60 * 1000);
    }

    return { init, load };
  })();

  document.addEventListener('DOMContentLoaded', () => AppMain.init());
</script>

</body>
</html>
